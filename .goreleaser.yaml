# GoReleaser config — builds the notification-service release binary on `v*` tags.
# Artifacts match the duynhlab/packages build-local contract so packages can
# consume the GitHub Release directly (see gha-workflows/.github/workflows/goreleaser.yml).
version: 2

project_name: notification-service

builds:
  - id: notification-service
    main: ./cmd
    binary: bin/notification-service # keep the bin/ prefix inside the archive
    env:
      - CGO_ENABLED=0
    goos:
      - linux
    goarch:
      - amd64
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{ .Version }}
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - formats: [tar.gz]
    # -> notification-service-<version>-linux-amd64.tar.gz (containing bin/notification-service)
    name_template: "{{ .ProjectName }}-{{ .Version }}-{{ .Os }}-{{ .Arch }}"

checksum:
  split: true # one <artifact>.sha256 per file

changelog:
  use: github
  format: "{{ .SHA }}: {{ .Message }}{{ if .Logins }} ({{ range $i, $l := .Logins }}{{ if $i }}, {{ end }}@{{ $l }}{{ end }}){{ end }}"

release:
  # owner/repo auto-detected from the git remote.
  extra_files:
    - glob: ./build-info.env # generated by the reusable workflow
